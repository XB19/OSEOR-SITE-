spring.application.name=backend_oseor

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oseor_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Data Initialization
spring.sql.init.mode=always
# data.sql contient des accents : sans cela Windows le lit en cp1252
spring.sql.init.encoding=UTF-8

# Server Configuration
server.port=${SERVER_PORT:8080}

# Security Debug
logging.level.org.springframework.security=INFO

# Mail Configuration (variables d'environnement : MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

oseor.mail.contact-to=Info@oseor.tg
oseor.mail.from=${MAIL_FROM:Info@oseor.tg}
jwt.secret=${JWT_SECRET}

# Envoi de fichiers depuis le tableau de bord
oseor.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
